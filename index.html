  --sh-3:0 30px 80px -30px rgba(0,0,0,.85),0 2px 10px rgba(0,0,0,.45);
}
[data-theme=dark] body{background:
  radial-gradient(900px 500px at 88% -8%,rgba(78,155,190,.16),transparent 62%),
  radial-gradient(700px 480px at 6% 104%,rgba(230,200,142,.12),transparent 60%),var(--canvas)}
[data-theme=dark] .sheet{box-shadow:var(--sh-2),inset 0 0 0 1px rgba(255,255,255,.05)}
[data-theme=dark] .topbar{background:rgba(17,37,48,.9)}
[data-theme=dark] .cw-tabs{background:rgba(17,37,48,.95)}
[data-theme=dark] .nav-i.on{background:rgba(255,255,255,.07);color:var(--gold-dk);box-shadow:none}
[data-theme=dark] .nav-i.on svg{color:var(--gold)}
[data-theme=dark] .brand-mark{background:linear-gradient(135deg,#1E4859,#122A36);box-shadow:inset 0 0 0 1px rgba(230,200,142,.25)}
[data-theme=dark] .brand-txt b{color:var(--gold-dk)}
[data-theme=dark] .btn-p{background:linear-gradient(135deg,#EBD5A4,#D8B87A);color:#0D2029;box-shadow:0 8px 22px -10px rgba(230,200,142,.6)}
[data-theme=dark] .btn-p:hover{background:linear-gradient(135deg,#F3E2BB,#E3C88E)}
[data-theme=dark] .btn-g{background:linear-gradient(135deg,#EBD5A4,#D8B87A);color:#0D2029}
[data-theme=dark] .btn.ok{background:#3E9B76;color:#fff}
[data-theme=dark] .b-navy{background:#2A5D75;color:#EAF2F6}
[data-theme=dark] .cmd-i.act{background:var(--gold);color:#0D2029}
[data-theme=dark] .cmd-i.act .ic{background:rgba(0,0,0,.14);color:#0D2029}
[data-theme=dark] .cmd-i.act .m,[data-theme=dark] .cmd-i.act .go{color:rgba(13,32,41,.7)}
[data-theme=dark] .earn{background:linear-gradient(135deg,#17384A 0%,#123040 48%,#0D2531 100%);box-shadow:0 30px 60px -36px #000,inset 0 0 0 1px rgba(230,200,142,.16)}
[data-theme=dark] .dl-panel{background:linear-gradient(160deg,#173A4A,#102A36);box-shadow:inset 0 0 0 1px rgba(230,200,142,.14)}
[data-theme=dark] .fin-big{background:linear-gradient(135deg,#17384A,#0D2531);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
[data-theme=dark] .svc-hero{background:linear-gradient(135deg,#17384A,#0D2531)}
[data-theme=dark] .kpi-c{box-shadow:inset 0 0 0 1px var(--line-2)}
[data-theme=dark] .kpi-c:hover{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 14px 30px -18px var(--c)}
[data-theme=dark] .tip{background:#0A1620;box-shadow:0 8px 24px -8px #000,0 0 0 1px rgba(255,255,255,.1)}
[data-theme=dark] .toast{background:#0A1620;box-shadow:0 18px 40px -12px #000,0 0 0 1px rgba(255,255,255,.1)}
[data-theme=dark] .scrim{background:rgba(2,10,15,.55)}
[data-theme=dark] .modal-wrap{background:rgba(2,10,15,.6)}
[data-theme=dark] .cmd-wrap{background:rgba(2,10,15,.6)}
[data-theme=dark] .tour-hole{box-shadow:0 0 0 9999px rgba(2,10,15,.72),0 0 0 2px var(--gold)}
[data-theme=dark] .kbd{background:rgba(255,255,255,.06);box-shadow:0 0 0 1px var(--line-2)}
[data-theme=dark] .paper-prev .pg{background:#F4F1EA}
[data-theme=dark] .dtile .paper{background:#E9E6DD}
[data-theme=dark] .heat i,[data-theme=dark] .waffle i{filter:saturate(1.25) brightness(1.1)}
[data-theme=dark] .report{box-shadow:inset 0 0 0 1px var(--line)}
[data-theme=dark] .fn-n{fill:#0D2029}
[data-theme=dark] .fn-l{fill:rgba(13,32,41,.72)}

[data-theme=dark] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16)}
[data-theme=dark] ::selection{background:rgba(230,200,142,.35)}
.theme-btn svg{transition:transform .5s var(--spring)}
.theme-btn:active svg{transform:rotate(180deg) scale(.85)}
html{transition:background-color .35s var(--ease)}
body,.sheet,.side,.report,.funnel-wrap,.kpi-c,.ent,.tk{transition:background-color .35s var(--ease),color .35s var(--ease),box-shadow .35s var(--ease)}


/* ---------- المهل الداخلية ---------- */
.sla-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.sla-sum button{padding:11px 8px;border-radius:12px;background:rgba(255,255,255,.05);text-align:center;transition:background .2s,transform .18s}
.sla-sum button:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}
.sla-sum b{display:block;font-size:22px;font-weight:600;line-height:1.2}
.sla-sum span{font-size:11px;color:rgba(233,230,221,.6)}
.sla-sum .s-ok b{color:#8FD8B4}.sla-sum .s-soon b{color:var(--gold)}.sla-sum .s-over b{color:#F0A08C}
.sla-list{display:flex;flex-direction:column}
.sla-row{display:flex;align-items:center;gap:12px;padding:12px 6px;cursor:pointer;border-top:1px solid rgba(255,255,255,.07);transition:background .18s}
.sla-row:hover{background:rgba(255,255,255,.04)}
.sla-row .tag{flex-shrink:0;width:52px;text-align:center;font-size:11px;font-weight:600;padding:5px 0;border-radius:8px;background:rgba(255,255,255,.08);color:rgba(233,230,221,.8)}
.sla-row.over .tag{background:rgba(240,160,140,.18);color:#F0A08C}
.sla-row.soon .tag{background:rgba(201,169,110,.18);color:var(--gold)}
.sla-row b{font-size:13px;font-weight:600;color:#fff;display:block;line-height:1.45}
.sla-row small{font-size:11.5px;color:rgba(233,230,221,.58);display:block;margin-top:1px}
.sla-bar{height:4px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
.sla-bar i{display:block;height:100%;border-radius:3px;background:var(--gold);animation:growX .8s var(--ease-out) both}
.sla-row.over .sla-bar i{background:#F0A08C}
.sla-left{text-align:end;flex-shrink:0;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.sla-left b{font-size:12.5px;white-space:nowrap;color:var(--gold-soft)}
.sla-row.over .sla-left b{color:#F0A08C}
.sla-more{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;margin-top:12px;padding:10px;border-radius:11px;font-size:12.5px;font-weight:600;
  color:var(--gold);background:rgba(201,169,110,.1);transition:background .2s}
.sla-more:hover{background:rgba(201,169,110,.18)}
.sla-more svg{width:14px;height:14px}
/* ---------- سطر التحديث الحي في التقرير ---------- */
.rp-live{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:13px;background:var(--gold-bg);margin-bottom:16px;font-size:13px;color:var(--ink);
  animation:liveIn .55s var(--spring);flex-wrap:wrap}
@keyframes liveIn{from{opacity:0;transform:translateY(-8px)}}
.rp-live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 22%,transparent);animation:blink 2s infinite;flex-shrink:0}
.rp-live b{color:var(--gold-dk);font-weight:700}
.rp-live .btn{margin-inline-start:auto}


/* ---------- خريطة التدفق ---------- */
.flow-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
.fs{display:flex;align-items:center;gap:13px;padding:15px 17px;border-radius:16px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line-2);animation:rbIn .5s var(--ease-out) both}
.fs .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--sheet))}
.fs .ic svg{width:19px;height:19px}
.fs b{display:block;font-size:25px;font-weight:600;color:var(--navy-xdk);line-height:1.15}
.fs span{font-size:12.5px;color:var(--mute)}
.flow-card{background:var(--sheet);border-radius:18px;box-shadow:inset 0 0 0 1px var(--line-2);padding:20px 22px}
.sk-wrap{overflow-x:auto}
.sankey{width:100%;min-width:760px;height:auto;overflow:visible}
.sk-link{transition:opacity .25s;animation:skIn .7s var(--ease-out) both}
@keyframes skIn{from{opacity:0}}
.sk-g:hover .sk-link{opacity:.85 !important}
.sankey:hover .sk-g:not(:hover) .sk-link{opacity:.16 !important}
.sk-stream{stroke-dasharray:5 26;stroke-linecap:round;opacity:.45;animation:stream 3.8s linear infinite;pointer-events:none}
@keyframes stream{to{stroke-dashoffset:-112}}
.sk-node rect{transition:filter .2s}
.sk-node:hover rect{filter:brightness(1.15)}
.sk-l{fill:var(--ink);font-size:12.5px;font-weight:600;font-family:var(--f-ui)}
.sk-n{fill:var(--mute);font-size:11px;font-family:var(--f-ui)}
.flow-read{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:14px 16px;border-radius:13px;background:var(--sunk);font-size:13.5px;line-height:1.9;color:var(--ink-2)}
.flow-read svg{flex-shrink:0;margin-top:5px;color:var(--gold-dk)}
.flow-read b{color:var(--navy-xdk);font-weight:700}
.pulse{display:flex;gap:12px;align-items:flex-start}
.pulse-y{display:flex;flex-direction:column;gap:6px;font-size:10.5px;color:var(--mute);padding-top:2px}
.pulse-y span{height:38px;line-height:38px;white-space:nowrap}
.pulse-g{display:flex;gap:6px;flex:1}
.pulse-col{display:flex;flex-direction:column;gap:6px;flex:1;text-align:center}
.pulse-col i{height:38px;border-radius:8px;display:block;transition:transform .18s,filter .18s;animation:wIn .45s var(--spring) both}
.pulse-col i:hover{transform:scale(1.06);filter:brightness(1.12)}
.pulse-col span{font-size:11px;color:var(--mute);margin-top:2px}
.speed-bar{display:flex;height:46px;border-radius:12px;overflow:hidden;gap:3px;margin-bottom:14px}
.speed-bar div{display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;animation:growX .9s var(--ease-out) both;transition:filter .2s}
.speed-bar div:hover{filter:brightness(1.12)}
.speed-leg{display:flex;flex-direction:column;gap:10px}
.speed-leg>div{display:flex;gap:9px;align-items:flex-start}
.speed-leg i{width:9px;height:9px;border-radius:3px;margin-top:5px;flex-shrink:0}
.speed-leg b{display:block;font-size:13px;font-weight:600}
.speed-leg span{font-size:12px;color:var(--mute)}
@media (max-width:1080px){.flow-stats{grid-template-columns:1fr 1fr}}
@media (max-width:760px){.pulse-y{display:none}.flow-card{padding:16px 14px}}


/* ---------- المجرى الموحّد ---------- */
.sankey .sk-g{cursor:pointer}
.sankey.focus .sk-g:not(.on) .sk-link{opacity:.12 !important}
.sankey.focus .sk-g:not(.on) .sk-shine,.sankey.focus .sk-g:not(.on) .sk-edge,.sankey.focus .sk-g:not(.on) .sk-stream{opacity:0}
.sk-shine{pointer-events:none;mix-blend-mode:screen}
.sk-edge{stroke-width:1.3;opacity:.9;pointer-events:none}
.sk-stream.gold{opacity:.7;stroke-dasharray:2 30;filter:drop-shadow(0 0 3px rgba(255,236,190,.9))}
.sk-g.is-done .sk-link{filter:drop-shadow(0 6px 14px rgba(184,145,75,.28))}
.sk-node.done rect{filter:drop-shadow(0 0 8px rgba(201,169,110,.75));animation:goldPulse 3.2s ease-in-out infinite}
@keyframes goldPulse{50%{filter:drop-shadow(0 0 14px rgba(230,200,142,.95))}}
.sk-node{cursor:pointer}
.sk-node rect{transition:filter .2s}
.sk-node:hover rect{filter:brightness(1.12)}
.sk-head{fill:var(--gold-dk);font-size:12px;font-weight:700;font-family:var(--f-ui);letter-spacing:.3px}
.sk-l.big{font-size:15px}
.sk-l.gold{fill:var(--gold-dk);font-size:14px}
.sk-num{fill:var(--navy-xdk);font-size:26px;font-weight:700;font-family:var(--f-disp)}
.sk-hint{display:none;align-items:center;gap:6px;font-size:12px;color:var(--mute);margin-bottom:8px}
@media (max-width:760px){.sk-hint{display:flex}}
.sk-warn{fill:var(--red);font-size:11px;font-weight:600;font-family:var(--f-ui)}
.sk-lab.pill rect{fill:var(--sheet);opacity:.93;stroke:var(--line-2)}
.sk-legend{display:flex;flex-wrap:wrap;gap:16px;align-items:center;font-size:12px;color:var(--ink-2);margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
.sk-legend span{display:flex;align-items:center;gap:7px}
.sk-legend i{width:22px;height:8px;border-radius:4px;display:block}
.lg-gold{background:linear-gradient(90deg,#E9D3A2,#C9A96E,#F3E3BC);box-shadow:0 0 6px rgba(201,169,110,.7)}
.lg-move{background:repeating-linear-gradient(90deg,var(--navy) 0 5px,transparent 5px 9px);opacity:.8}
.lg-still{background:var(--faint);opacity:.6}
.lg-red{background:#C4643F}
.fs.gold{box-shadow:inset 0 0 0 1px rgba(201,169,110,.55),0 10px 26px -18px rgba(184,145,75,.8);background:linear-gradient(135deg,var(--sheet),var(--gold-bg))}
.fs.gold b{color:var(--gold-dk)}



/* ==========================================================
   الرسائل الداخلية
   ========================================================== */
.letters{margin-bottom:30px}
.delete-pending{box-shadow:inset -4px 0 0 var(--red);background:color-mix(in srgb,var(--red-bg) 55%,var(--surface,#fff))}
.delete-marker{display:flex;align-items:center;gap:5px;width:fit-content;max-width:100%;margin-top:6px;padding:4px 9px;border:1px solid var(--red);border-radius:7px;background:var(--red-bg);color:var(--red);font:600 11.5px var(--f-ui);cursor:pointer;white-space:normal;text-align:start}
.delete-marker:hover{filter:brightness(.93)}
.btn-destructive{background:var(--red)!important;color:#fff!important;border-color:var(--red)!important}
.danger-note{padding:12px;border:1px solid var(--red);border-radius:10px;background:var(--red-bg);color:var(--red);line-height:1.9}
.ent-danger{border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
button[aria-busy=true]{cursor:progress;opacity:.7}
.letter-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:2;font-size:14px}
.letters-error{padding:12px 16px;border-radius:10px;background:var(--amber-bg);color:var(--ink);margin-bottom:12px;font-size:13px}
.letters .sec-t .badge{margin-inline-start:4px}
.msg-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,.62fr);gap:12px}
.msg-list{display:flex;flex-direction:column;gap:10px}
.msg-card{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:16px;text-align:start;background:var(--sheet);
  box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .25s,transform .25s var(--ease),background .25s;animation:rbIn .5s var(--ease-out) both;min-width:0}
.msg-card:hover{box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-2);transform:translateY(-2px)}
.msg-card.unread{background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 7%,var(--sheet)),var(--sheet) 70%);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--blue) 35%,transparent)}
.msg-card.unread::before{content:"";position:absolute;inset-inline-start:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--blue)}
.mc-top{display:flex;align-items:center;gap:10px}
.mc-top time{font-size:11.5px;color:var(--mute);white-space:nowrap;align-self:flex-start}
.mc-top small{font-size:11.5px;color:var(--mute);display:block}
.mc-who{display:flex;align-items:center;gap:6px;min-width:0}
.mc-who b{font-size:13.5px;font-weight:600}
.dir{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:5px;flex-shrink:0}
.dir.in{background:var(--blue-bg);color:var(--blue)}.dir.out{background:var(--gold-bg);color:var(--gold-dk)}
.mc-subj{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--navy-xdk);min-width:0}
.udot{width:8px;height:8px;border-radius:50%;background:var(--blue);flex-shrink:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent);animation:blink 2s infinite}
.mc-prev{font-size:12.5px;line-height:1.7;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.mc-foot{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:auto}
.mc-foot .badge svg{width:11px;height:11px}
.mc-new{font-size:11px;font-weight:700;color:var(--blue)}
.rc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--mute)}
.rc.read{color:var(--blue);font-weight:600}
.msg-new{align-items:center;justify-content:center;text-align:center;background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2);border:0}
.msg-new:hover{background:var(--sunk);box-shadow:inset 0 0 0 1.5px var(--navy)}
.msg-new b{font-size:13.5px}.msg-new small{font-size:12px;color:var(--mute)}
.mn-ic{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--navy);color:#fff;transition:transform .35s var(--spring)}
.msg-new:hover .mn-ic{transform:translate(-3px,-3px) rotate(-8deg)}
.mn-ic svg{width:19px;height:19px}
[data-theme=dark] .mn-ic{background:var(--gold);color:#0D2029}
.typing-inline{display:inline-flex;gap:3px;margin-inline-end:6px;vertical-align:middle}
.typing-inline i,.bub-b.typing i{width:6px;height:6px;border-radius:50%;background:var(--mute);display:block;animation:typing 1.2s infinite}
.typing-inline i:nth-child(2),.bub-b.typing i:nth-child(2){animation-delay:.15s}.typing-inline i:nth-child(3),.bub-b.typing i:nth-child(3){animation-delay:.3s}
@keyframes typing{0%,60%,100%{transform:none;opacity:.45}30%{transform:translateY(-4px);opacity:1}}
/* المحادثة */
.dlv{display:flex;align-items:center;gap:6px;padding:12px 14px;border-radius:12px;background:var(--sunk);margin-bottom:14px}
.dlv span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--faint);white-space:nowrap}
.dlv span i{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px currentColor;transition:all .35s var(--spring)}
.dlv span i svg{width:10px;height:10px;stroke-width:3}
.dlv span.on{color:var(--ink);font-weight:600}.dlv span.on i{background:var(--blue);color:#fff;box-shadow:none}
.dlv span small{font-size:11px;color:var(--mute);font-weight:400}
.dlv em{flex:1;height:2px;border-radius:2px;background:var(--line-2);transition:background .4s}.dlv em.on{background:var(--blue)}
.msg-ref{display:flex;align-items:center;gap:10px;width:100%;padding:11px 13px;border-radius:12px;text-align:start;box-shadow:inset 0 0 0 1px var(--line-2);margin-bottom:14px;transition:background .2s}
.msg-ref:hover{background:var(--sunk)}
.msg-ref b{display:block;font-size:13px}.msg-ref small{font-size:11.5px;color:var(--mute)}
.thread{display:flex;flex-direction:column;gap:10px}
.day-sep{text-align:center;margin:2px 0 4px}
.day-sep span{font-size:11px;color:var(--mute);background:var(--sunk);padding:3px 10px;border-radius:10px}
.bub{display:flex;align-items:flex-end;gap:8px;max-width:84%}
.bub.them{align-self:flex-start}
.bub.me{align-self:flex-end}
.bub-b{padding:10px 14px 7px;border-radius:16px;font-size:13.5px;line-height:1.8}
.bub.them .bub-b{background:var(--sunk);border-end-start-radius:5px}
.bub.me .bub-b{background:var(--navy);color:#fff;border-end-end-radius:5px}
[data-theme=dark] .bub.me .bub-b{background:#2A5D75}
.bub-b time{display:block;font-size:10.5px;opacity:.6;margin-top:2px;text-align:end}
.bub-b.typing{display:flex;gap:4px;padding:13px 16px}
.pop-in{animation:bubIn .45s var(--spring)}
@keyframes bubIn{from{opacity:0;transform:translateY(10px) scale(.94)}}
.seen{align-self:flex-end;display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--blue)}
.composer-bar{display:flex;align-items:flex-end;gap:8px;width:100%}
.composer-bar textarea{flex:1;resize:none;border:0;outline:none;background:var(--sheet);border-radius:14px;padding:10px 14px;font-size:14px;line-height:1.6;max-height:140px;
  box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .2s}
.composer-bar textarea:focus{box-shadow:inset 0 0 0 1.5px var(--navy),0 0 0 4px rgba(27,58,75,.07)}
.send-btn{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--navy);color:#fff;flex-shrink:0;transition:transform .3s var(--spring),background .2s}
.send-btn:hover{transform:translate(-2px,-2px) rotate(-8deg)}
.send-btn svg{width:18px;height:18px}
[data-theme=dark] .send-btn{background:var(--gold);color:#0D2029}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
/* إنشاء رسالة */
.to-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.to-chip{position:relative;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:12px;text-align:start;box-shadow:inset 0 0 0 1px var(--line-2);transition:all .2s}
.to-chip:hover{background:var(--sunk)}
.to-chip.on{background:color-mix(in srgb,var(--blue) 9%,var(--sheet));box-shadow:inset 0 0 0 1.5px var(--blue)}
.to-chip b{display:block;font-size:13px}.to-chip small{font-size:11px;color:var(--mute)}
.to-chip .tick{position:absolute;top:6px;inset-inline-end:6px;width:17px;height:17px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;animation:pop .35s var(--spring)}
.to-chip .tick svg{width:10px;height:10px;stroke-width:3}
.switch-row{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;height:40px}
.switch-row input{display:none}
.switch{width:38px;height:22px;border-radius:11px;background:var(--sunk-2);position:relative;transition:background .25s;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;right:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--spring)}
.switch-row input:checked+.switch{background:var(--red)}
.switch-row input:checked+.switch::after{transform:translateX(-16px)}
.lt-err{font-size:12.5px;color:var(--red);min-height:18px;margin-top:8px}

/* ---------- شعار أعراف ---------- */

.top-emb{display:none;width:26px;height:28px}

.hello-emb{position:relative;width:78px;height:84px;flex-shrink:0;display:grid;place-items:center;animation:embFloat 6s ease-in-out infinite}
.hello-emb .emb{position:relative;width:62px;height:68px;filter:drop-shadow(0 10px 16px rgba(151,119,60,.35));overflow:hidden;
  -webkit-mask:var(--emblem) center/contain no-repeat;mask:var(--emblem) center/contain no-repeat}
.hello-emb .shine::after{content:"";position:absolute;inset:-10%;background:linear-gradient(115deg,transparent 38%,rgba(255,250,235,.85) 50%,transparent 62%);transform:translateX(130%);animation:sheen 5.5s ease-in-out infinite 1s}
@keyframes sheen{0%{transform:translateX(130%)}35%,100%{transform:translateX(-130%)}}
@keyframes embFloat{50%{transform:translateY(-5px)}}
.hello-emb .orbit{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(201,169,110,.22),transparent 66%);z-index:-1;animation:glow 6s ease-in-out infinite alternate}
.earn>div.earn-mark{position:absolute;z-index:0;left:-30px;bottom:-54px;width:250px;height:272px;background:var(--emblem) center/contain no-repeat;opacity:.07;transform:rotate(-8deg);pointer-events:none;transition:opacity .6s,transform 1.2s var(--ease-out)}
.earn:hover>div.earn-mark{opacity:.11;transform:rotate(-4deg) scale(1.04)}
[data-theme=dark] .earn>div.earn-mark{opacity:.1}

/* ==========================================================
   الفاحص القانوني
   ========================================================== */
.lex{margin:0 0 6px;padding:16px 18px;border-radius:16px;position:relative;overflow:hidden;
  background:linear-gradient(135deg,color-mix(in srgb,var(--navy) 5%,var(--sheet)),color-mix(in srgb,var(--gold) 9%,var(--sheet)));
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 35%,transparent)}
.lex::before{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 22%,transparent),transparent 70%);pointer-events:none}
.lex-h{display:flex;align-items:center;gap:12px;position:relative}
.lex-h b{display:block;font-size:14px;font-weight:700;color:var(--navy-xdk)}
.lex-h small{font-size:12px;color:var(--mute)}
.lex-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy-2));box-shadow:0 6px 14px -6px var(--navy)}
.lex-ic svg{width:19px;height:19px}
.lex-ic.lg{width:46px;height:46px;border-radius:13px}
[data-theme=dark] .lex-ic{background:linear-gradient(135deg,#E6C88E,#C9A96E);color:#0D2029;box-shadow:0 6px 14px -6px rgba(230,200,142,.6)}
.lex-pills{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 10px;position:relative}
.lex-sum{font-size:13.5px;line-height:1.85;color:var(--ink);margin-bottom:8px;position:relative}
.lex-risk{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.75;color:var(--ink-2);padding:3px 0;position:relative}
.lex-risk>i{width:8px;height:8px;border-radius:50%;margin-top:8px;flex-shrink:0}
.lex-foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;position:relative}
.lex-msg{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 13px;border-radius:12px;font-size:13px;line-height:1.7;background:var(--sunk);color:var(--ink-2);position:relative}
.lex-msg svg{flex-shrink:0}
.lex-msg .btn{margin-inline-start:auto}
.lex-msg.err{background:var(--red-bg);color:var(--red)}
.lex-msg.ok{background:var(--green-bg);color:var(--green)}
.lex-scan{display:flex;align-items:center;gap:18px;margin-top:14px;position:relative}
.scan-doc{position:relative;width:62px;height:76px;border-radius:8px;background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-1);padding:12px 10px;display:flex;flex-direction:column;gap:6px;overflow:hidden;flex-shrink:0}
.scan-doc i{height:4px;border-radius:2px;background:var(--line-2);display:block}
.scan-doc i:nth-child(2){width:80%}.scan-doc i:nth-child(4){width:60%}
.scan-line{position:absolute;left:0;right:0;height:18px;top:-18px;background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--gold) 55%,transparent),transparent);animation:scan 1.6s ease-in-out infinite}
@keyframes scan{to{top:78px}}
.scan-steps{display:flex;flex-direction:column;gap:7px;font-size:12.5px;color:var(--faint)}
.scan-steps span{display:flex;align-items:center;gap:8px}
.scan-steps span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line-2)}
.scan-steps span.on{color:var(--ink)}.scan-steps span.on::before{background:var(--green)}
.scan-steps span.pulse{color:var(--ink-2)}.scan-steps span.pulse::before{background:var(--gold);animation:blink 1.2s infinite}
.lex-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--sunk);border-radius:14px;padding:12px 4px;margin-bottom:16px}
.lex-grid>div{padding:0 16px;line-height:1.35}.lex-grid>div+div{border-inline-start:1px solid var(--line-2)}
.lex-grid span{display:block;font-size:11.5px;color:var(--mute)}.lex-grid b{font-size:17px;font-weight:600}
.lex-p{font-size:13.5px;line-height:1.95;color:var(--ink)}
.lex-law{padding:10px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line-2);margin-bottom:8px}
.lex-law b{font-size:13.5px}.lex-law p{font-size:12.5px;line-height:1.8;color:var(--ink-2);margin-top:4px}
.lex-steps{padding-inline-start:20px;display:flex;flex-direction:column;gap:6px;font-size:13.5px;line-height:1.75}
.lex-steps li::marker{color:var(--gold-dk);font-weight:700}
.lex-draft{font-size:13.5px;line-height:1.9;min-height:170px}
.lex-note{display:flex;gap:8px;align-items:flex-start;margin-top:18px;font-size:12px;line-height:1.75;color:var(--mute)}
.lex-note svg{flex-shrink:0;margin-top:3px}
.lex-dot{display:inline-flex;vertical-align:middle;margin-inline-start:6px;color:var(--c)}
.lex-dot svg{width:15px;height:15px}


/* ---------- مؤشر الفاحص التلقائي ---------- */
.lex-live{display:inline-flex;align-items:center;gap:11px;margin-top:12px;padding:7px 14px 7px 8px;border-radius:14px;text-align:start;
  background:var(--sheet);box-shadow:inset 0 0 0 1px var(--line-2);transition:box-shadow .2s,transform .2s var(--ease)}
.lex-live:hover{box-shadow:inset 0 0 0 1px var(--gold),var(--sh-2);transform:translateY(-1px)}
.lex-live b{display:block;font-size:13px;font-weight:600;color:var(--navy-xdk)}
.lex-live small{display:block;font-size:12px;color:var(--mute);max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lex-live em{font-style:normal;color:var(--red);font-weight:600}
.ll-ring{position:relative;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--navy);
  background:conic-gradient(var(--green) calc(var(--p) * 1%),var(--sunk-2) 0)}
.ll-ring::before{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--sheet)}
.ll-ring svg{position:relative;width:17px;height:17px}
.lex-live.run .ll-ring::after{content:"";position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;border-top-color:var(--gold);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lex-live.pause .ll-ring,.lex-live.stop .ll-ring{color:var(--red)}
.lex-live.off{opacity:.8}.lex-live.off .ll-ring{background:var(--sunk-2)}
.lex-live.off svg{width:17px;height:17px;color:var(--mute)}
.lex-top.run svg{animation:blink 1.4s infinite;color:var(--gold-dk)}
.switch.on-green{}
.switch-row input:checked+.switch.on-green{background:var(--green)}

/* ---------- Toast ---------- */
function toast(msg, { undo, action, info } = {}) {
  const box = $('#toasts'); const el = document.createElement('div'); el.className = 'toast';
  el.innerHTML = `<span class="ic ${info ? 'info' : ''}">${ic(info ? 'bell' : 'check')}</span><span>${esc(msg)}</span>${undo ? '<button data-u>تراجع</button>' : ''}${action ? `<button data-x>${action[0]}</button>` : ''}`;
  box.appendChild(el);
  const kill = () => { el.classList.add('out'); setTimeout(() => el.remove(), 260); };
  const t = setTimeout(kill, 4200);

/* ---------- Tooltip & peek ---------- */
let tipEl, tipT, peekT;

      const r = t.getBoundingClientRect(); const w = tipEl.offsetWidth, h = tipEl.offsetHeight;
      let x = r.left + r.width / 2 - w / 2, y = r.top - h - 8; if (y < 6) y = r.bottom + 8;

    }, 280);
  }
  const pk = e.target.closest('[data-peek]');

/* ---------- Animated counters ---------- */

  $$('[data-count]', root).forEach((el) => {

    const to = +el.dataset.count, dec = +el.dataset.dec || 0, pre = el.dataset.pre || '', suf = el.dataset.suf || '';
    const from = +(el._from || 0); const t0 = performance.now(); const dur = 900;
    const f = (t) => { const k = Math.min(1, (t - t0) / dur); const e = 1 - Math.pow(1 - k, 3); const v = from + (to - from) * e;
      el.textContent = pre + (dec ? v.toFixed(dec) : fmt(v)) + suf; if (k < 1) requestAnimationFrame(f); };

}

  labels.forEach((l, i) => { g += `<text class="axis" x="${xRTL(i, n, w, padL + 14, padR + 14)}" y="${h - 6}" text-anchor="middle">${l}</text>`; });

  let lines = '';
  series.forEach((s) => {
    const pts = s.values.map((v, i) => v == null ? null : [xRTL(i, n, w, padL + 14, padR + 14), y(v)]).filter(Boolean);

  }).join('');
  return `<div class="donut" style="width:${size}px;height:${size}px"><svg width="${size}" height="${size}" style="transform:rotate(-90deg)">${arcs}</svg><div class="donut-c">${inner}</div></div>`;

  { k: 'assigned', l: 'أُسند لموظف', c: '#6A5A8C', d: '#A995DA', f: () => REQUESTS.filter((r) => r.assigned_at).length, nav: 'assigned' },

function pipeStats() {
  const v = PIPE.map((p) => p.f());
  const open = REQUESTS.filter(isOpen);
  const groups = [['new', 'pending'], ['assigned'], ['contacted', 'waiting'], ['progress', 'review']];
  const names = ['بانتظار الإسناد', 'مسندة دون تواصل', 'بانتظار العميل والمستندات', 'قيد التنفيذ والمراجعة'];
  const stalls = groups.map((g, i) => { const rs = open.filter((r) => g.includes(r.status)); const age = rs.length ? rs.reduce((a, r) => a + (nowDate() - r.updated_at) / DAY, 0) / rs.length : 0; return { l: names[i], n: rs.length, days: age, st: g.join(',') }; });
  const worst = stalls.slice().sort((a, b) => b.days * b.n - a.days * a.n)[0];
  const closed = REQUESTS.filter((r) => r.closed_at);
  const avgClose = closed.length ? Math.round(closed.reduce((a, r) => a + (r.closed_at - r.created_at) / 36e5, 0) / closed.length) : 0;
  const fastest = (() => { const m = {}; closed.filter((r) => r.status === 'done').forEach((r) => { const h = (r.closed_at - r.created_at) / 36e5; (m[r.service] = m[r.service] || []).push(h); });

  return { v, stalls, worst, avgClose, fastest, conv: Math.round((v[4] / (v[0] || 1)) * 100), drop: Math.round(((v[0] - v[1]) / (v[0] || 1)) * 100) };
}

function funnel() {

    const pts = `${W / 2 - w1 / 2},${y} ${W / 2 + w1 / 2},${y} ${W / 2 + w2 / 2},${y + BH} ${W / 2 - w2 / 2},${y + BH}`;

}

function applyBusiness(snapshot) {

    usage[e.id] = {};
    for (const row of snapshot.usage || []) {
      if (row.entity_id !== e.id || row.reversed_at) continue;
      if (e.current_cycle_start && row.cycle_start && String(row.cycle_start).slice(0,10) !== String(e.current_cycle_start).slice(0,10)) continue;
      if (e.current_cycle_end && row.cycle_end && String(row.cycle_end).slice(0,10) !== String(e.current_cycle_end).slice(0,10)) continue;
      usage[e.id][row.service_key] = (usage[e.id][row.service_key] || 0) + Number(row.units || 0);
    }
  }
  replaceRows(ENTITIES, (snapshot.entities || []).map(e => ({ ...e, name:e.name || '', plan:knownPlan(e.plan_key),
    sub:Object.hasOwn(SUB_ST,e.subscription_status) ? e.subscription_status : 'unknown', manager:e.manager_id || e.assigned_to,
    contact:e.contact_name || '', phone:e.contact_phone || '', type:e.entity_type || '', city:e.city || '', cr:e.commercial_registration || '',
    start:liveDate(e.current_cycle_start || e.subscription_start), cycle_end:liveDate(e.current_cycle_end), usage:usage[e.id] || {} })));
  replaceRows(BIZ_REQUESTS, (snapshot.requests || []).map(b => ({ ...b, entity:b.entity_id,
    service:Object.hasOwn(BIZ_SERVICES,b.service_key)?b.service_key:'general', subject:b.subject || b.service_name_snapshot || 'طلب',
    priority:Object.hasOwn(PRI,b.priority) ? b.priority : 'normal',

    no:b.request_number || b.id, units:Number(b.quota_units || 1), counted:!!b.quota_counted,
    billing:b.billing_status || 'included', client_note:b.client_visible_note || '', internal_note:b.internal_note || '', details:b.details || '',
    created_at:liveDate(b.created_at),updated_at:liveDate(b.updated_at || b.created_at) })));

function rebuildMetrics() {

function liveBusy(button, label='جارٍ الحفظ…') {
  const controls=$$('#modal.show button, #modal.show input, #modal.show textarea, #modal.show select');
  if(button && !controls.includes(button)) controls.push(button);
  const saved=controls.map(el=>[el,el.disabled]); const html=button?.innerHTML;
  controls.forEach(el=>el.disabled=true);
  if(button){button.setAttribute('aria-busy','true');button.innerHTML=ic('clock')+esc(label);}
  return ()=>{saved.forEach(([el,disabled])=>el.disabled=disabled);if(button){button.removeAttribute('aria-busy');button.innerHTML=html;}};
}
function livePrepareVerification() {
  const verification={startedAt:Date.now(),promise:LIVE.store.verify()};
  // Opening a modal starts verification; a failure is shown when saving.
  verification.promise.catch(()=>{});
  return verification;
}
LIVE.run = async function(key, task, message='حُفظ التغيير', options={}) {
  if(LIVE.pending.has(key)) return;
  LIVE.pending.add(key);
  const resetBusy=liveBusy(options.button || $('#modal.show [data-a="liveSave"]') || $('#modal.show [data-a="doAssign"]'),options.busyLabel);
  try {
    const verification=options.verification;
    if(verification && Date.now()-verification.startedAt<15000) await verification.promise;
    else await LIVE.store.verify();
    if (LIVE.store.user.id !== ME) throw new Error('تغير الحساب؛ أعد تحميل الصفحة');
    const result=await task();
    const requestSaved=key.startsWith('request:') && result?.data?.id;
    if(requestSaved){
      LIVE.requestVersion++;
      const row=mapRequest(result.data),i=REQUESTS.findIndex(r=>r.id===row.id);
      if(i<0) REQUESTS.push(row); else REQUESTS.splice(i,1,row);
      rebuildMetrics();
    } else if(!options.local) await LIVE.refresh();
    closeModal(); if(DR.stack.length) refreshDrawer(); rerender(); livePaintStatus();
    toast(result?.warning || message,{info:!!result?.warning});
    if(result?.audit) result.audit.then(warning=>{if(warning)toast(warning,{info:true});});
    return result;
  } catch(e) { toast(e.message || 'تعذر الحفظ. حدّث البيانات للتحقق قبل تكرار الإجراء',{info:true}); }
  finally {LIVE.pending.delete(key);resetBusy();}
};

      openModal(`<div class="m-h"><h3 class="h2">بانتظار اعتماد الحذف</h3></div><div class="m-b"><p>طلبه: ${esc(pending.requested_by_name || '')}</p><p>يلزم اعتماد الحذف من مستخدم إداري آخر. لم يُحذف الطلب بعد.</p></div><div class="m-f"><button class="btn btn-s" data-a="mClose">إغلاق</button></div>`);return;
    }
    liveForm('اعتماد الحذف',`<p>طلبه: ${esc(pending.requested_by_name || '')}</p><p class="danger-note">سيُحذف طلب ${esc(r.customer)} نهائيًا من قاعدة البيانات المشتركة. لا يمكن التراجع عن الحذف.</p>`,()=>LIVE.run('delete:'+r.id,async()=>{
      await LIVE.store.approveDelete(pending);
      LIVE.requestVersion++;LIVE.deleteVersion++;delete LIVE.store.rows[r.id];
      replaceRows(REQUESTS,REQUESTS.filter(x=>x.id!==r.id));
      LIVE.deletes=LIVE.deletes.filter(d=>String(d.request_id)!==String(r.id));
      closeDrawer();rebuildMetrics();
    },'اعتُمد الحذف',{local:true}),'اعتماد الحذف');
  }else{
    if(!canManage())return toast('هذا الإجراء متاح للإدارة',{info:true});
    liveForm('حذف الطلب',`<p>سيُرسل طلب الحذف للاعتماد من مستخدم إداري آخر.</p>`+liveNote('سبب الحذف','liveDeleteReason'),()=>LIVE.run('delete:'+r.id,async()=>{
      LIVE.store.requireUser(true); const reason=val('liveDeleteReason');if(!reason)throw new Error('اكتب سبب الحذف');
      const row=await LIVE.store.insert('request_delete_requests',{request_id:r.id,requested_by:ME,requested_by_name:LIVE.store.user.name,status:'pending'},true);
      LIVE.deleteVersion++;LIVE.deletes.push(row);
      return {warning:await LIVE.store.audit(r.id,'delete_request','طلب حذف: '+reason)};
    },'سُجّل طلب الحذف وينتظر اعتماد مستخدم آخر'),'حذف الطلب');
  }
  $('#modal [data-a="liveSave"]')?.classList.add('btn-destructive');
};
function resetRequests(){liveForm('طلب تصفير العداد','<p>يسجل هذا الإجراء طلبًا للإدارة وفق الآلية الحالية.</p>',()=>LIVE.run('reset-request',()=>LIVE.store.insert('ops_reset_requests',{requested_by:ME,requested_by_name:LIVE.store.user.name,status:'pending'},true),'سُجّل طلب التصفير'),'إرسال الطلب');};
A.resetReview=resetRequests;
A.actContact=el=>LIVE.run('activation:'+el.dataset.id,()=>liveApi('ops-update-activation-request',{id:el.dataset.id,action:'contacted',note:'تم التواصل'}),'سُجل التواصل');
A.actClose=el=>liveForm('إغلاق طلب التفعيل',liveNote('ملاحظة','liveActNote'),()=>LIVE.run('activation:'+el.dataset.id,()=>liveApi('ops-update-activation-request',{id:el.dataset.id,action:'closed',note:val('liveActNote')}),'أُغلق طلب التفعيل'));
A.actActivate=el=>{
  const a=ACTIVATIONS.find(x=>x.id===el.dataset.id);
  liveForm('تفعيل '+a.name,liveSelect('الباقة','livePlan',Object.values(PLANS).filter(p=>p.key!=='unknown').map(p=>[p.key,p.name]),a.plan)+liveField('بداية الاشتراك','liveStart',new Date().toISOString().slice(0,10),'date'),async()=>{
    if(LIVE.pending.has('activate'))return;LIVE.pending.add('activate');
    try{
      await LIVE.store.verify();LIVE.store.requireUser(true);
      const data=await liveApi('ops-activate-business',{id:a.id,plan_key:val('livePlan'),subscription_start:val('liveStart')});
      const c=data.credentials;if(!c?.code || !c?.pin)throw new Error('لم يُرجع الخادم بيانات الدخول؛ حدّث الطلب للتحقق من التفعيل');
      openModal(`<div class="m-h"><h3 class="h2">تم التفعيل</h3></div><div class="m-b"><p>احفظ البيانات قبل إغلاق النافذة؛ تُعرض مرة واحدة.</p>${liveField('رمز المنشأة','entityCode',c.code)}${liveField('الرقم السري','entityPin',c.pin)}</div><div class="m-f"><button class="btn btn-p" data-a="mClose">تم الحفظ</button></div>`);
      await LIVE.refresh();rerender();
    }catch(e){toast(e.message,{info:true});}finally{LIVE.pending.delete('activate');}
  },'تفعيل الحساب');
};
A.meMenu=el=>openPop(el,[{h:LIVE.store.user.name},{l:'تسجيل الخروج',f:async()=>{await window.opsAuth.auth.signOut();localStorage.removeItem('araf_session');location.replace('login.html');}}]);
A.settings=()=>toast('الصلاحيات والحسابات هي إعدادات المنصة الحالية',{info:true});
const unavailable=()=>toast('لا توجد خدمة حفظ مرتبطة بهذا الإجراء في المنصة الأصلية؛ لم يُنفذ أي تغيير',{info:true});
A.saveBizNote=A.bizAssign=A.bizStatus=unavailable;
A.remindClients=A.remindTeam=()=>toast('الإرسال الجماعي غير متاح. افتح الطلب للتواصل مع العميل',{info:true});
A.remindOne=el=>{
  const r=REQ(el.dataset.id);let phone=r.phone.replace(/\D/g,'');if(phone.startsWith('05'))phone='966'+phone.slice(1);
  if(!phone)return;window.open('https://wa.me/'+phone,'_blank','noopener,noreferrer');
};
CTX.ent=id=>[{l:'فتح المنشأة',f:()=>A.openEnt({dataset:{id}})},...(canManage()?[{l:'إلغاء الاشتراك وحذف المنشأة',red:true,f:()=>A.deleteEntity({dataset:{id}})}]:[])];
A.deleteEntity=el=>{
  const entity=ENTITIES.find(e=>e.id===el.dataset.id);if(!entity)return;
  if(!canManage())return toast('هذا الإجراء متاح للإدارة',{info:true});
  liveForm('إلغاء الاشتراك وحذف المنشأة',`<p><b>${esc(entity.name)}</b> — <span dir="ltr">${esc(entity.code)}</span></p><p class="danger-note">سيُحذف اشتراك المنشأة وطلباتها وسجلات استهلاكها نهائيًا من قاعدة البيانات المشتركة، ويظهر الحذف في المنصة الأصلية أيضًا. لا يمكن التراجع عن هذا الإجراء.</p><p>ستُزال قيمة اشتراكها من الإيراد الشهري المتكرر.</p>`+liveField('اكتب رمز المنشأة لتأكيد الحذف','deleteEntityCode')+`<label class="row gap8"><input type="checkbox" id="deleteEntityAgree">أؤكد حذف هذه المنشأة وبياناتها المرتبطة.</label>`,()=>{
    const confirmation=val('deleteEntityCode'),agree=$('#deleteEntityAgree')?.checked;
    if(!agree)return toast('أكد موافقتك على الحذف',{info:true});
    return LIVE.run('entity-delete:'+entity.id,async()=>{
      const result=await LIVE.store.deleteEntity(entity,confirmation);
      if(!result.ok || String(result.entity_id)!==String(entity.id))throw new Error('لم يؤكد الخادم حذف المنشأة');
      LIVE.businessVersion++;
      replaceRows(ENTITIES,ENTITIES.filter(e=>e.id!==entity.id));
      replaceRows(BIZ_REQUESTS,BIZ_REQUESTS.filter(r=>r.entity!==entity.id));
      replaceRows(ACTIVATIONS,ACTIVATIONS.filter(a=>a.entity_code!==entity.code && a.metadata?.activated_entity_id!==entity.id));
      closeDrawer();rebuildMetrics();return result;
    },'حُذفت المنشأة وبيانات اشتراكها، وحُدّث الإيراد',{local:true});
  },'إلغاء الاشتراك وحذف المنشأة');
  $('#modal [data-a="liveSave"]')?.classList.add('btn-destructive');
};
A.stub=unavailable;
function downloadCsv(name,rows){
  const cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"';
  const blob=new Blob(['\uFEFF'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
}
A.exportRequests=()=>downloadCsv('requests',[['رقم الطلب','العميل','الجوال','الخدمة','الحالة','القيمة'],...filtered(S.kind).map(r=>[r.id,r.customer,r.phone,svName(r),ST[r.status].l,r.price])]);
A.exportActivity=()=>downloadCsv('activity',[['الوقت','المستخدم','النشاط'],...LOG.map(l=>[l.at?.toISOString(),U(l.by).name,l.text])]);
A.exportUsage=()=>downloadCsv('usage',[['المنشأة','الباقة','الخدمة','المستهلك'],...ENTITIES.flatMap(e=>Object.entries(e.usage).map(([key,n])=>[e.name,PLANS[e.plan].name,BIZ_SERVICES[key]||key,n]))]);
const panelWithAttachments=reqPanel;
reqPanel=function(id){const panel=panelWithAttachments(id),r=REQ(id);const label='المرفقات';
  const start=panel.body.indexOf('<div class="dsec"><h4>'+ic('file','width="15" height="15"')+label);
  const end=panel.body.indexOf('<div class="dsec"><h4>'+ic('msg','width="15" height="15"'),start);
  if(start>=0&&end>start)panel.body=panel.body.slice(0,start)+`<div class="dsec"><h4>المرفقات</h4>${r.attachments.map(f=>{
    const url=typeof f==='string'?f:f.url || f.publicUrl || f.file_url || '';const name=typeof f==='string'?f:f.name || f.file_name || 'مرفق';
    return /^https:\/\//i.test(url)?`<a class="li" target="_blank" rel="noopener noreferrer" href="${esc(url)}">${ic('file')}${esc(name)}</a>`:`<div class="li">${esc(name)} — رابط التنزيل غير متاح</div>`;
  }).join('')||'<p class="muted">لا مرفقات</p>'}</div>`+panel.body.slice(end);
  panel.foot+=`<button class="btn btn-s" data-a="payment" data-id="${esc(id)}">حالة الدفع</button>`;
  if(canManage() || pendingDelete(id))panel.foot+=`<button class="btn btn-s btn-danger" data-a="reviewDelete" data-id="${esc(id)}">${deleteActionLabel(id)}</button>`;
  return panel;
};
A.reviewDelete=el=>askDelete(REQ(el.dataset.id));

A.payment=el=>{const id=el.dataset.id;liveForm('تحديث حالة الدفع',liveSelect('الحالة','livePayment',Object.entries(PAY).filter(([key])=>key!=='unknown').map(([key,v])=>[key,v.l]),REQ(id).payment),()=>LIVE.run('request:'+id,()=>{LIVE.store.requireUser(true);return LIVE.store.patchRequest(id,{payment_status:val('livePayment')},'payment','تحديث حالة الدفع');}));};
// The snapshot API supports business reads and activation, but exposes no
// contract for request mutation/quota accounting. Never fake these saves.
HOOKS.push(root=>{
  $$('[data-a="bizAssign"],[data-a="bizStatus"],[data-a="saveBizNote"]',root).forEach(el=>{el.disabled=true;el.title='حفظ تعديلات طلبات المنشآت غير متاح عبر الربط الحالي';});
});
