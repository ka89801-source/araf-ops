<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>استعادة كلمة المرور | منصة أعراف لإدارة الطلبات</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(1200px 600px at 80% -10%, rgba(61,123,138,.18), transparent 60%),
        radial-gradient(900px 500px at 10% 110%, rgba(201,169,110,.18), transparent 60%),
        linear-gradient(180deg, #FAFAF7 0%, #F1ECE2 100%);
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(27,58,75,.08);
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 28px 70px -30px rgba(27,58,75,.35);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 26px;
    }

    .brand-badge {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #C9A96E, #D9BF8E);
      color: #1B3A4B;
      font-family: 'Cairo', sans-serif;
      font-weight: 800;
      font-size: 19px;
    }

    h1 {
      margin: 0 0 8px;
      font-family: 'Cairo', sans-serif;
      color: #1B3A4B;
      font-size: 24px;
    }

    .sub {
      margin: 0 0 24px;
      color: #6F7F88;
      font-size: 14px;
      line-height: 1.8;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
      color: #1B3A4B;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1.5px solid #E8E2D5;
      border-radius: 12px;
      padding: 0 14px;
      font: inherit;
      box-sizing: border-box;
      outline: none;
    }

    .field input:focus {
      border-color: #3D7B8A;
      box-shadow: 0 0 0 4px rgba(61,123,138,.10);
    }

    .btn {
      width: 100%;
      min-height: 48px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #1B3A4B, #234D63);
      color: #fff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait;
    }

    .msg {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13px;
      line-height: 1.7;
    }

    .msg.show { display: block; }
    .msg.error { background: rgba(220,38,38,.08); color: #B91C1C; border-right: 3px solid #DC2626; }
    .msg.success { background: rgba(16,185,129,.09); color: #047857; border-right: 3px solid #10B981; }
    .msg.info { background: rgba(61,123,138,.08); color: #285F6C; border-right: 3px solid #3D7B8A; }

    .hidden { display: none !important; }

    .back {
      display: inline-block;
      margin-top: 18px;
      color: #3D7B8A;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <div class="brand-badge">أ</div>
      <div>
        <strong style="font-family:Cairo;color:#1B3A4B;">أعراف</strong>
        <div style="font-size:11px;color:#7A8991;">لوحة إدارة الطلبات</div>
      </div>
    </div>

    <h1>استعادة كلمة المرور</h1>
    <p class="sub" id="pageSub">أدخل بريد حسابك وسنرسل لك رابطًا آمنًا لتعيين كلمة مرور جديدة.</p>

    <div id="message" class="msg"></div>

    <form id="requestForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" required autocomplete="email" dir="ltr" placeholder="name@example.com" />
      </div>
      <button id="requestBtn" class="btn" type="submit">إرسال رابط الاستعادة</button>
    </form>

    <form id="passwordForm" class="hidden">
      <div class="field">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input id="newPassword" type="password" required minlength="8" autocomplete="new-password" dir="ltr" />
      </div>
      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <input id="confirmPassword" type="password" required minlength="8" autocomplete="new-password" dir="ltr" />
      </div>
      <button id="saveBtn" class="btn" type="submit">حفظ كلمة المرور الجديدة</button>
    </form>

    <a class="back" href="login.html">العودة إلى تسجيل الدخول</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js"></script>
  <script>
    const message = document.getElementById('message');
    const requestForm = document.getElementById('requestForm');
    const passwordForm = document.getElementById('passwordForm');
    const pageSub = document.getElementById('pageSub');
    const requestBtn = document.getElementById('requestBtn');
    const saveBtn = document.getElementById('saveBtn');

    const recoveryAuth = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY,
      {
        auth: {
          persistSession: true,
          autoRefreshToken: true,
          detectSessionInUrl: true,
          storageKey: 'araf-ops-recovery'
        }
      }
    );

    function setMessage(text, type) {
      message.textContent = text;
      message.className = 'msg show ' + (type || 'info');
    }

    function recoveryRedirectUrl() {
      const base = window.location.href.split('#')[0].split('?')[0];
      return base;
    }

    function showPasswordForm() {
      requestForm.classList.add('hidden');
      passwordForm.classList.remove('hidden');
      pageSub.textContent = 'اكتب كلمة المرور الجديدة ثم احفظها.';
      setMessage('تم التحقق من رابط الاستعادة. يمكنك الآن تعيين كلمة مرور جديدة.', 'success');
    }

    async function detectRecoverySession() {
      try {
        const result = await recoveryAuth.auth.getSession();
        const session = result.data && result.data.session;
        if (session) showPasswordForm();
      } catch (error) {
        console.error('recovery-session', error);
      }
    }

    recoveryAuth.auth.onAuthStateChange(function (event, session) {
      if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) {
        showPasswordForm();
      }
    });

    requestForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      if (!email) return;

      requestBtn.disabled = true;
      requestBtn.textContent = 'جارٍ الإرسال...';

      try {
        const result = await recoveryAuth.auth.resetPasswordForEmail(email, {
          redirectTo: recoveryRedirectUrl()
        });

        if (result.error) throw result.error;

        setMessage('تم إرسال رابط جديد إلى بريدك. افتح أحدث رسالة فقط، لأن الروابط القديمة قد تنتهي صلاحيتها.', 'success');
      } catch (error) {
        console.error('recovery-request', error);
        setMessage(
          (error && error.message ? error.message : 'تعذر إرسال رابط الاستعادة.') +
          ' إذا ظهر خطأ متعلقًا بالتحويل، أضف هذا الرابط إلى Redirect URLs في Supabase: ' + recoveryRedirectUrl(),
          'error'
        );
      } finally {
        requestBtn.disabled = false;
        requestBtn.textContent = 'إرسال رابط الاستعادة';
      }
    });

    passwordForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password.length < 8) {
        setMessage('كلمة المرور يجب أن تكون 8 أحرف على الأقل.', 'error');
        return;
      }

      if (password !== confirmPassword) {
        setMessage('كلمتا المرور غير متطابقتين.', 'error');
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'جارٍ الحفظ...';

      try {
        const result = await recoveryAuth.auth.updateUser({ password: password });
        if (result.error) throw result.error;

        setMessage('تم تغيير كلمة المرور بنجاح. سيتم نقلك إلى صفحة الدخول.', 'success');
        await recoveryAuth.auth.signOut();
        localStorage.removeItem('araf_session');

        setTimeout(function () {
          window.location.href = 'login.html';
        }, 1200);
      } catch (error) {
        console.error('password-update', error);
        setMessage(error && error.message ? error.message : 'تعذر تغيير كلمة المرور.', 'error');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'حفظ كلمة المرور الجديدة';
      }
    });

    detectRecoverySession();
  </script>
</body>
</html>
